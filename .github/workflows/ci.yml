name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (types, build, tests)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/api/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx vitest run
      - uses: actions/upload-artifact@v4
        with: { name: api-dist, path: apps/api/dist, retention-days: 1 }

  web:
    name: Web (types, build)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck:e2e
      - uses: actions/upload-artifact@v4
        with: { name: web-out, path: apps/web/out, retention-days: 1 }

  e2e:
    name: Browser tests (real pages, real API, in-memory database)
    needs: [api, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: "apps/*/package-lock.json" }
      - run: npm ci
        working-directory: apps/api
      - run: npm ci
        working-directory: apps/web
      - uses: actions/download-artifact@v4
        with: { name: api-dist, path: apps/api/dist }
      - uses: actions/download-artifact@v4
        with: { name: web-out, path: apps/web/out }
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npx playwright test
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-traces, path: apps/web/test-results, retention-days: 7 }
